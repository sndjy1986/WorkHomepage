<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Unit Distance Checker + Mapbox</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      padding: 1.5rem;
      background: #0b0c10;
      color: #f5f5f5;
    }

    h1 { margin-bottom: 0.5rem; }
    .subtitle {
      margin-bottom: 1.5rem;
      color: #c7c7c7;
      font-size: 0.95rem;
    }

    .card {
      background: #151821;
      border-radius: 0.75rem;
      padding: 1rem 1.25rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      margin-bottom: 1.25rem;
    }

    form {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.6rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid #333;
      background: #0e1017;
      color: #f5f5f5;
    }

    button {
      padding: 0.6rem 1.1rem;
      border-radius: 0.5rem;
      background: #2c82ff;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      transition: 0.15s;
    }
    button:hover { background: #1f6ad4; }

    .status {
      margin-top: 0.75rem;
      min-height: 1.2rem;
    }

    .view-toggle {
      margin: 1rem 0;
      background: #11131b;
      border-radius: 999px;
      display: inline-flex;
      padding: 0.2rem;
    }
    .view-toggle button {
      background: transparent;
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      border: none;
      color: #fff;
    }
    .view-toggle button.active { background: #2c82ff; }

    #list-view { display: flex; gap: 1.25rem; flex-wrap: wrap; }
    #map-view { display: none; }

    table {
      width: 100%;
      margin-top: 0.75rem;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      text-align: left;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid #333;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #c7c7c7;
    }
    td { padding: 0.45rem 0.25rem; }
    tr.highlight td { background: rgba(44,130,255,0.15); }

    #map {
      width: 100%;
      height: 450px;
      border-radius: 0.75rem;
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popup {
      background: #1c1f2b;
      padding: 2rem;
      border-radius: 1rem;
      max-width: 400px;
      text-align: center;
      border: 1px solid #2c82ff;
    }
    .popup button { margin-top: 1rem; width: 100%; }
  </style>
</head>
<body>
  <h1>Unit Distance Checker</h1>
  <div class="subtitle">Driving distance and ETA from all EMS units.</div>

  <div class="card">
    <form id="address-form">
      <input id="address-input" type="text" placeholder="5531 Airport Rd. Anderson, SC 29625" />
      <button type="submit">Check Distances</button>
    </form>
    <div id="status" class="status"></div>

    <div class="view-toggle">
      <button id="btn-list" class="active">List View</button>
      <button id="btn-map">Map View</button>
    </div>
  </div>

  <div id="list-view">
    <div class="card" style="flex:1;">
      <h2>Transport Trucks</h2>
      <table id="results-transport" style="display:none;">
        <thead><tr><th>Unit</th><th>Address</th><th>Distance</th><th>ETA</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <div class="card" style="flex:1;">
      <h2>QRV Paramedics</h2>
      <table id="results-qrv" style="display:none;">
        <thead><tr><th>Unit</th><th>Address</th><th>Distance</th><th>ETA</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div id="map-view" class="card">
    <div id="map"></div>
  </div>

<script>
const MAPBOX_TOKEN = 'sk.eyJ1Ijoic25kankxOTg2IiwiYSI6ImNtbnlteDJiNTAzbnQyd3E0a3cyejYzeDcifQ.jFIm1m1HGBOs-lrGCB0Dyw';
mapboxgl.accessToken = MAPBOX_TOKEN;
// Using URL Blocking to only accept requests from this address
function closePopup() { document.getElementById('overlay').style.display = 'none'; }

// INSTRUCTIONS: For best performance, replace these addresses with [longitude, latitude] 
// e.g., lng: -82.637, lat: 34.520. If left as strings, they use extra Geocoding credits.
const TRANSPORT_UNITS = [
  { name: "Med-0", addr: "1009 N Fant St. Anderson, SC 29625" },
  { name: "Med-1", addr: "1009 N Fant St. Anderson, SC 29625" },
  { name: "Med-2", addr: "135 HWY 413, Belton SC 29627" },
  { name: "Med-3", addr: "3228 S Main St, Anderson, SC 29624" },
  { name: "Med-4", addr: "902 Anderson Dr. Williamston SC 29697" },
  { name: "Med-5", addr: "2850 Concord Rd Anderson SC 29621" },
  { name: "Med-6", addr: "9711 SC-81, Iva SC 29655" },
  { name: "Med-7", addr: "108 N Depot St Pendleton SC 29670" },
  { name: "Med-8", addr: "8508 SC-24 Townville SC 29689" },
  { name: "Med-9", addr: "103 Construction Way Anderson SC 29625" },
  { name: "Med-10", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-11", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-12", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-13", addr: "6 Gaines Rd Honea Path SC 29654" },
  { name: "Med-14", addr: "10600 Anderson Rd Easley SC 29642" },
  { name: "Med-15", addr: "2209 SC-86 Piedmont SC 29673" },
  { name: "Med-16", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-17", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-18", addr: "1009 N Fant St Anderson SC 29625" },
  { name: "Med-19", addr: "1009 N Fant St Anderson SC 29625" }
];

const QRV_UNITS = [
  { name: "A-5",  addr: "103 Construction Way Anderson SC 29625" },
  { name: "A-8",  addr: "1009 N Fant St Anderson SC 29625" },
  { name: "ALS-2", addr: "5321 US-76 Pendleton SC 29670" },
  { name: "ALS-3", addr: "3228 S Main St Anderson SC 29624" },
  { name: "ALS-4", addr: "7715 SC-81 Starr SC 29684" },
  { name: "ALS-6", addr: "101 Main St Pelzer SC 29669" },
  { name: "ALS-7", addr: "10600 Anderson Rd Easley SC 29642" },
  { name: "ALS-11", addr: "5125 Dobbins Bridge Rd Anderson SC 29626" },
  { name: "ALS-12", addr: "1 Holmes St Belton SC 29627" },
  { name: "ALS-17", addr: "316 Hattons Ford Rd Townville SC 29689" },
  { name: "ALS-19", addr: "1058 Martin Rd Anderson SC 29621" },
  { name: "ALS-21", addr: "1118 Trail Rd Honea Path SC 29654" },
  { name: "ALS-23", addr: "1416 Due West Hwy Anderson SC 29621" },
  { name: "ALS-24", addr: "2209 SC-86 Piedmont SC 29673" },
  { name: "ALS-27", addr: "3738 SC-187 Anderson SC 29626" }
];

let map, marker;

// Helper to geocode an address string
async function geocode(address) {
  const res = await fetch(`https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(address)}.json?access_token=${MAPBOX_TOKEN}`);
  const data = await res.json();
  if (!data.features || data.features.length === 0) throw new Error("Location not found");
  return data.features[0].center; // [lng, lat]
}

document.getElementById("address-form").addEventListener("submit", async e => {
  e.preventDefault();
  const address = document.getElementById("address-input").value.trim();
  const status = document.getElementById("status");
  if (!address) return;

  status.textContent = "Locating call address...";

  try {
    const destCoords = await geocode(address);

    status.textContent = "Calculating unit distances...";

    // Batch process the units
    await Promise.all([
      processUnitGroup(TRANSPORT_UNITS, destCoords, "results-transport"),
      processUnitGroup(QRV_UNITS, destCoords, "results-qrv")
    ]);

    status.textContent = "Updates complete.";
    updateMap(destCoords);

  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
});

async function processUnitGroup(units, dest, tableId) {
  // Convert unit addresses to coordinates if not already provided as [lng, lat]
  const unitCoords = await Promise.all(units.map(async u => {
    if (u.lng && u.lat) return [u.lng, u.lat];
    return await geocode(u.addr);
  }));

  const coordString = [dest.join(','), ...unitCoords.map(c => c.join(','))].join(';');
  const url = `https://api.mapbox.com/directions-matrix/v1/mapbox/driving/${coordString}?sources=0&annotations=distance,duration&access_token=${MAPBOX_TOKEN}`;
  
  const res = await fetch(url);
  const data = await res.json();

  if (data.code !== 'Ok') throw new Error("Matrix calculation failed");

  const results = units.map((u, i) => ({
    name: u.name,
    addr: u.addr,
    distance: (data.distances[0][i+1] * 0.000621371).toFixed(2), // to miles
    duration: Math.round(data.durations[0][i+1] / 60) // to minutes
  })).sort((a, b) => a.distance - b.distance);

  renderTable(results, tableId);
}

function renderTable(results, tableId) {
  const table = document.getElementById(tableId);
  const tbody = table.querySelector("tbody");
  tbody.innerHTML = "";
  results.forEach((r, i) => {
    const row = document.createElement("tr");
    if (i === 0) row.classList.add("highlight");
    row.innerHTML = `<td>${r.name}</td><td>${r.addr}</td><td>${r.distance} mi</td><td>${r.duration} mins</td>`;
    tbody.appendChild(row);
  });
  table.style.display = "table";
}

function updateMap(coords) {
  if (!map) {
    map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/dark-v11',
      center: coords,
      zoom: 11
    });
  }
  if (marker) marker.remove();
  marker = new mapboxgl.Marker({ color: '#2c82ff' }).setLngLat(coords).addTo(map);
  map.flyTo({ center: coords, zoom: 12 });
}

// UI Toggle Logic
const btnList = document.getElementById("btn-list");
const btnMap = document.getElementById("btn-map");
btnList.onclick = () => { 
  document.getElementById("list-view").style.display = "flex"; 
  document.getElementById("map-view").style.display = "none"; 
  btnList.classList.add("active"); btnMap.classList.remove("active"); 
};
btnMap.onclick = () => { 
  document.getElementById("list-view").style.display = "none"; 
  document.getElementById("map-view").style.display = "block"; 
  btnMap.classList.add("active"); btnList.classList.remove("active"); 
  if(map) map.resize(); 
};
</script>

</body>
</html>
