<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Dispatch | Command Console v22</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bright-red: #ff0000;
            --hosp-orange: #ff8c00;
            --post-blue: #00d4ff;
            --bg-dark: #0a0a0a;
            --panel-bg: #161616;
            --sidebar-w: 240px;
        }

        /* PREVENT SELECTION HIGHLIGHT */
        * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; outline: none; box-sizing: border-box; }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* LEFT SIDEBAR */
        #left-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; border-right: 2px solid #222; flex-shrink: 0; }
        #system-status-box { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid #333; }
        #gas-gauge { font-size: 52px; font-weight: 900; line-height: 1; margin: 5px 0; color: var(--neon-green); }
        .gauge-label { font-size: 10px; color: #888; letter-spacing: 1px; font-weight: bold; }
        .list-header { font-size: 11px; padding: 10px; background: #1a1a1a; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #available-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }

        /* CENTER WORKSPACE */
        #center-workspace { flex-grow: 1; display: flex; flex-direction: column; border-right: 2px solid #222; height: 100vh; position: relative; }
        #map-container { flex: 1; position: relative; overflow: hidden; background: #000; cursor: grab; }
        #map-container:active { cursor: grabbing; }
        #map-content { position: absolute; transform-origin: 0 0; will-change: transform; top: 0; left: 0; min-width: 3000px; min-height: 3000px; }
        #background-map { display: block; pointer-events: none; }

        #timer-section { height: 260px; background: #111; border-top: 2px solid #333; display: flex; flex-direction: column; z-index: 20; }
        #timer-grid { flex-grow: 1; display: flex; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }

        /* RIGHT SIDEBAR */
        #right-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        #recommendation-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }
        
        .rec-card { 
            background: #1a1a1a; border-left: 4px solid var(--post-blue); 
            padding: 12px; margin-bottom: 10px; border-radius: 4px;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border { 0% { border-left-color: #004c5b; } 50% { border-left-color: var(--post-blue); } 100% { border-left-color: #004c5b; } }
        .rec-title { font-size: 10px; color: var(--post-blue); font-weight: bold; margin-bottom: 4px; }
        .rec-instruction { font-size: 13px; font-weight: bold; color: #fff; }

        /* UNIT CARDS */
        .unit-slot { min-height: 55px; border: 1px solid #222; margin-bottom: 8px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .ambulance-icon { 
            padding: 10px; cursor: grab; display: flex; flex-direction: column; align-items: center; 
            background: #262626; border: 1px solid #444; border-radius: 4px; width: 100%; transition: opacity 0.3s;
        }
        .unit-label { font-size: 14px; font-weight: 900; }
        .unit-home-post { font-size: 9px; color: #999; margin-top: 3px; text-align: center; }

        /* STATES */
        .state-map { width: 80px !important; border-color: var(--bright-red); border-width: 2px; box-shadow: 0 0 15px rgba(255,0,0,0.3); }
        .state-map .unit-label { color: var(--bright-red); }
        .state-dest .unit-label { color: var(--hosp-orange); border-bottom: 1px solid var(--hosp-orange); }
        .oos { filter: grayscale(1) brightness(0.4); opacity: 0.5 !important; border-style: dashed; }
        .hidden-unit { display: none !important; }

        /* CONFIG MODAL & GEAR */
        #system-gear { 
            position: fixed; bottom: 20px; right: 20px; z-index: 1000; 
            font-size: 24px; cursor: pointer; color: #555; background: #000; 
            width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; 
            border-radius: 50%; border: 1px solid #333; transition: color 0.3s;
        }
        #system-gear:hover { color: #fff; border-color: #666; }

        #config-modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.85); z-index: 2000; display: none; 
            align-items: center; justify-content: center; 
        }
        #config-panel { 
            background: #1a1a1a; width: 500px; max-height: 80vh; border-radius: 8px; 
            border: 1px solid #444; display: flex; flex-direction: column; padding: 20px; 
        }
        .config-list { flex-grow: 1; overflow-y: auto; margin: 15px 0; border-top: 1px solid #333; }
        .config-item { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px; border-bottom: 1px solid #222; 
        }
        .toggle-switch { cursor: pointer; padding: 5px 12px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .toggle-on { background: var(--neon-green); color: #000; }
        .toggle-off { background: #333; color: #888; }

        /* CONTEXT MENU */
        #context-menu { position: fixed; display: none; background: #1a1a1a; border: 1px solid #444; z-index: 10000; width: 200px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .menu-item { padding: 12px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #222; }
        .menu-item:hover { background: #333; }

        .timer-card { min-width: 170px; background: #1a1a1a; border-top: 4px solid var(--hosp-orange); padding: 12px; border-radius: 4px; border: 1px solid #333; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 30px; margin: 5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="left-sidebar">
        <div id="system-status-box">
            <div class="gauge-label">SYSTEM STATUS</div>
            <div id="gas-gauge">0</div>
            <div class="gauge-label">UNITS READY</div>
        </div>
        <div class="list-header">Stationed Units</div>
        <div id="available-list"></div>
    </div>

    <div id="center-workspace">
        <div id="map-container">
            <div id="map-content">
                <img src="map.jpeg" id="background-map">
            </div>
        </div>
        <div id="timer-section">
            <div class="list-header">
                <span>Active Hospital Timers</span>
                <button onclick="resetView()" style="font-size:9px; cursor:pointer; background:#333; color:white; border:none; padding:3px 8px; border-radius:3px;">RESET VIEW</button>
            </div>
            <div id="timer-grid"></div>
        </div>
    </div>

    <div id="right-sidebar">
        <div class="list-header">Move-Up Recommendation</div>
        <div id="recommendation-list"></div>
    </div>

    <div id="system-gear" onclick="toggleConfig(true)">⚙️</div>

    <div id="config-modal">
        <div id="config-panel">
            <h2 style="margin-top:0;">Fleet Configuration</h2>
            <div style="font-size: 12px; color: #888;">Deactivating a unit hides it from the console completely.</div>
            <div class="config-list" id="config-list-content"></div>
            <button onclick="toggleConfig(false)" style="padding:10px; background:var(--post-blue); border:none; border-radius:4px; font-weight:bold; cursor:pointer;">CLOSE CONFIG</button>
        </div>
    </div>

    <div id="context-menu">
        <div id="menu-id" style="text-align:center; padding:10px; font-size:11px; color:#aaa; background:#000; font-weight:bold; border-bottom:1px solid #333;">UNIT</div>
        <div class="menu-item" onclick="startTimer(20, 'GMH')">Mark On Call: GMH (20m)</div>
        <div class="menu-item" onclick="startTimer(20, 'AMH')">Mark On Call: AMH (20m)</div>
        <div class="menu-item" onclick="startTimer(25, 'SFCH')">Mark On Call: SFCH (25m)</div>
        <div class="menu-item" onclick="toggleOOS()" style="color:var(--bright-red); font-weight:bold;">TOGGLE OUT OF SERVICE</div>
    </div>

    <script>
        const posts = [
            { id: 1, name: "Rock Springs", homeUnits: ["Med-2"], addr: "135 HWY 413", isPrimary: true },
            { id: 2, name: "Homeland Park", homeUnits: ["Med-3"], addr: "3228 S Main St", isPrimary: true },
            { id: 3, name: "Honea Path", homeUnits: ["Med-13"], addr: "6 Gaines Rd.", isPrimary: true },
            { id: 4, name: "Wren", homeUnits: ["Med-15"], addr: "2209 SC-86", isPrimary: true },
            { id: 5, name: "Iva", homeUnits: ["Med-6"], addr: "9711 SC-81", isPrimary: true },
            { id: 6, name: "Williamston", homeUnits: ["Med-4"], addr: "902 Anderson Dr.", isPrimary: true },
            { id: 7, name: "Pendleton", homeUnits: ["Med-7"], addr: "111 N Depot St", isPrimary: true },
            { id: 8, name: "Powdersville", homeUnits: ["Med-14"], addr: "10600 Anderson Rd", isPrimary: true },
            { id: 9, name: "Townville", homeUnits: ["Med-8"], addr: "8508 SC-24", isPrimary: true },
            { id: 10, name: "Centerville", homeUnits: ["Med-9"], addr: "103 Construction Way", isPrimary: true },
            { id: 12, name: "Hopewell", homeUnits: ["Med-5"], addr: "2850 Concord Rd", isPrimary: true },
            { id: 11, name: "Headquarters", homeUnits: ["Med-0", "Med-1", "Med-10", "Med-11"], addr: "1009 N Fant St", isPrimary: false },
            { id: 16, name: "Headquarters B", homeUnits: ["Med-12", "Med-16", "Med-17", "Med-18", "Med-19"], addr: "1009 N Fant St.", isPrimary: false }
        ];

        let units = [];
        posts.forEach(p => {
            p.homeUnits.forEach(uId => {
                units.push({ id: uId, homePost: p.name, addr: p.addr, isPrimary: p.isPrimary });
            });
        });

        const mapContainer = document.getElementById('map-container');
        const mapContent = document.getElementById('map-content');
        const availableList = document.getElementById('available-list');
        const recList = document.getElementById('recommendation-list');
        const timerGrid = document.getElementById('timer-grid');
        const gauge = document.getElementById('gas-gauge');
        const ctxMenu = document.getElementById('context-menu');
        
        let selectedUnitId = null;
        let scale = 1, posX = 0, posY = 0;

        function updateTransform() { mapContent.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
        function resetView() { scale = 1; posX = 0; posY = 0; updateTransform(); }

        // MOUSE/WHEEL MAP
        mapContainer.onwheel = e => {
            e.preventDefault();
            const rect = mapContainer.getBoundingClientRect();
            const zoomFactor = 1 + (-Math.sign(e.deltaY) * 0.1);
            const newScale = scale * zoomFactor;
            if (newScale > 0.1 && newScale < 5) {
                posX = (e.clientX - rect.left) - ((e.clientX - rect.left) - posX) * zoomFactor;
                posY = (e.clientY - rect.top) - ((e.clientY - rect.top) - posY) * zoomFactor;
                scale = newScale; updateTransform();
            }
        };

        mapContainer.onmousedown = e => {
            if (e.shiftKey || e.button === 1) {
                let sX = e.clientX - posX, sY = e.clientY - posY;
                document.onmousemove = ev => { posX = ev.clientX - sX; posY = ev.clientY - sY; updateTransform(); };
                document.onmouseup = () => document.onmousemove = null;
            }
        };

        // STATUS LOGIC
        function updateStatus() {
            let readyCount = 0;
            let criticalGaps = [];
            let flexibleUnits = [];

            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (!el) return;

                // Check Config Deactivation
                const isDeactivated = localStorage.getItem(`inactive-${u.id}`) === 'true';
                if (isDeactivated) {
                    el.classList.add('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.add('hidden-unit');
                    return;
                } else {
                    el.classList.remove('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.remove('hidden-unit');
                }

                el.classList.remove('state-map', 'state-dest');
                const hasTimer = document.querySelectorAll(`.timer-card[data-unit="${u.id}"]`).length > 0;
                const isOOS = el.classList.contains('oos');
                const isOnMap = el.parentElement.id === 'map-content';
                const isStationed = el.parentElement.closest('#available-list');

                if (hasTimer) {
                    el.classList.add('state-dest');
                    if (u.isPrimary) criticalGaps.push({ post: u.homePost, addr: u.addr });
                } else if (isOOS) {
                    // OOS units do not count toward system status and trigger gaps
                    if (u.isPrimary) criticalGaps.push({ post: u.homePost, addr: u.addr });
                } else {
                    // Ready for Service
                    readyCount++;
                    if (isOnMap) el.classList.add('state-map');
                    if (!u.isPrimary && isStationed) flexibleUnits.push(u.id);
                }
            });

            gauge.innerText = readyCount;
            gauge.style.color = readyCount <= 3 ? "var(--bright-red)" : "var(--neon-green)";

            // Recommendations
            recList.innerHTML = '';
            criticalGaps.forEach(gap => {
                const helper = flexibleUnits.shift();
                if (helper) {
                    const card = document.createElement('div');
                    card.className = 'rec-card';
                    card.innerHTML = `<div class="rec-title">COVERAGE ALERT: ${gap.post}</div><div class="rec-instruction">Move <b>${helper}</b> to cover <b>${gap.addr}</b></div>`;
                    recList.appendChild(card);
                }
            });

            if (recList.innerHTML === '') {
                recList.innerHTML = '<div style="color:#444; font-size:11px; text-align:center; margin-top:30px; padding:20px; border:1px dashed #222;">SYSTEM STABLE</div>';
            }
        }

        // INITIALIZE
        function init() {
            renderConfigMenu();
            units.forEach(u => {
                const slot = document.createElement('div');
                slot.className = 'unit-slot'; slot.id = `slot-${u.id}`;
                availableList.appendChild(slot);

                const div = document.createElement('div');
                div.className = 'ambulance-icon'; div.id = u.id;
                div.innerHTML = `<div class="unit-label">${u.id}</div><div class="unit-home-post">${u.homePost}</div>`;
                
                div.oncontextmenu = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    selectedUnitId = u.id;
                    document.getElementById('menu-id').innerText = u.id + " | " + u.homePost;
                    ctxMenu.style.display = 'block';
                    ctxMenu.style.left = Math.min(e.pageX, window.innerWidth - 200) + 'px';
                    ctxMenu.style.top = Math.min(e.pageY, window.innerHeight - 300) + 'px';
                };

                const savedPos = localStorage.getItem(`pos-${u.id}`);
                if (localStorage.getItem(`oos-${u.id}`) === 'true') div.classList.add('oos');

                if (savedPos) {
                    const p = JSON.parse(savedPos);
                    div.style.position = 'absolute'; div.style.left = p.left; div.style.top = p.top;
                    mapContent.appendChild(div);
                } else {
                    slot.appendChild(div);
                }
                makeDraggable(div);
            });
            updateStatus();
        }

        // DRAG AND DROP
        function makeDraggable(el) {
            let ox = 0, oy = 0;
            el.onmousedown = (e) => {
                if(e.button !== 0 || e.shiftKey) return;
                e.preventDefault(); e.stopPropagation();
                const r = el.getBoundingClientRect();
                ox = (e.clientX - r.left) / scale; oy = (e.clientY - r.top) / scale;
                el.style.position = 'fixed'; el.style.width = '180px'; el.style.zIndex = '1000';
                document.body.appendChild(el);
                document.onmousemove = (ev) => {
                    el.style.left = (ev.clientX - (ox * scale)) + "px";
                    el.style.top = (ev.clientY - (oy * scale)) + "px";
                };
                document.onmouseup = (ev) => {
                    document.onmousemove = null;
                    const mapR = mapContainer.getBoundingClientRect();
                    if (ev.clientX > mapR.left && ev.clientX < mapR.right && ev.clientY < mapR.bottom) {
                        const c = mapContent.getBoundingClientRect();
                        el.style.position = 'absolute'; el.style.left = ((ev.clientX - c.left) / scale - ox) + "px";
                        el.style.top = ((ev.clientY - c.top) / scale - oy) + "px";
                        mapContent.appendChild(el);
                        localStorage.setItem(`pos-${el.id}`, JSON.stringify({left: el.style.left, top: el.style.top}));
                    } else {
                        const slot = document.getElementById(`slot-${el.id}`);
                        slot.appendChild(el);
                        el.style.position = "relative"; el.style.left = "0"; el.style.top = "0"; el.style.width = "100%";
                        localStorage.removeItem(`pos-${el.id}`);
                    }
                    updateStatus();
                };
            };
        }

        // TIMER / DISPATCH
        function startTimer(min, hosp) {
            const timerId = Date.now();
            const card = document.createElement('div');
            card.className = 'timer-card'; card.id = `card-${timerId}`; card.dataset.unit = selectedUnitId;
            card.innerHTML = `
                <div style="font-weight:bold; font-size:18px; color:var(--hosp-orange);">${selectedUnitId}</div>
                <div style="font-size:10px; color:#aaa;">BUSY: ${hosp}</div>
                <div class="timer-display" id="time-${timerId}">--:--</div>
                <button onclick="dismissTimer('${timerId}')" style="width:100%; font-size:10px; background:#333; color:white; border:1px solid #444; padding:6px; cursor:pointer; border-radius:3px;">CLEAR UNIT</button>
            `;
            timerGrid.appendChild(card);
            ctxMenu.style.display = 'none';
            updateStatus();
            let sec = min * 60;
            const run = setInterval(() => {
                const el = document.getElementById(`time-${timerId}`);
                if(!el) { clearInterval(run); return; }
                sec--; const a = Math.abs(sec), m = Math.floor(a/60), s = a%60;
                el.innerText = (sec < 0 ? "-" : "") + m + ":" + (s < 10 ? "0"+s : s);
                if (sec < 0) el.style.color = "var(--bright-red)";
            }, 1000);
        }

        function dismissTimer(tId) { document.getElementById(`card-${tId}`).remove(); updateStatus(); }

        function toggleOOS() {
            const el = document.getElementById(selectedUnitId);
            const isOOS = el.classList.toggle('oos');
            localStorage.setItem(`oos-${selectedUnitId}`, isOOS);
            ctxMenu.style.display = 'none'; 
            updateStatus();
        }

        // CONFIG MENU LOGIC
        function toggleConfig(show) { document.getElementById('config-modal').style.display = show ? 'flex' : 'none'; }

        function renderConfigMenu() {
            const container = document.getElementById('config-list-content');
            container.innerHTML = '';
            units.sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric: true})).forEach(u => {
                const isInactive = localStorage.getItem(`inactive-${u.id}`) === 'true';
                const item = document.createElement('div');
                item.className = 'config-item';
                item.innerHTML = `
                    <div>
                        <div style="font-weight:bold;">${u.id}</div>
                        <div style="font-size:10px; color:#666;">${u.homePost}</div>
                    </div>
                    <div id="btn-${u.id}" class="toggle-switch ${isInactive ? 'toggle-off' : 'toggle-on'}" onclick="toggleUnitActive('${u.id}')">
                        ${isInactive ? 'DEACTIVATED' : 'IN SERVICE'}
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function toggleUnitActive(uId) {
            const current = localStorage.getItem(`inactive-${uId}`) === 'true';
            localStorage.setItem(`inactive-${uId}`, !current);
            renderConfigMenu();
            updateStatus();
        }

        window.onclick = (e) => {
            if (e.target === document.getElementById('config-modal')) toggleConfig(false);
            ctxMenu.style.display = 'none';
        }
        window.onload = init;
    </script>
</body>
</html>
