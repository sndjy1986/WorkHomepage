<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Dispatch | Command Console v28</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bright-red: #ff0000;
            --hosp-orange: #ff8c00;
            --logistics-blue: #00d4ff;
            --bg-dark: #0a0a0a;
            --panel-bg: #161616;
            --sidebar-w: 260px;
        }

        /* PREVENT NATIVE SELECTION */
        * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; outline: none; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* LEFT SIDEBAR */
        #left-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; border-right: 2px solid #222; flex-shrink: 0; }
        #system-status-box { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid #333; }
        #gas-gauge { font-size: 52px; font-weight: 900; line-height: 1; margin: 5px 0; color: var(--neon-green); }
        .gauge-label { font-size: 10px; color: #888; letter-spacing: 1px; font-weight: bold; }
        .recall-btn { margin-top: 10px; padding: 8px; font-size: 9px; background: #222; border: 1px solid #444; color: #aaa; cursor: pointer; border-radius: 3px; width: 100%; font-weight: bold; }
        .recall-btn:hover { background: #333; color: var(--neon-green); border-color: var(--neon-green); }

        .list-header { font-size: 11px; padding: 10px; background: #1a1a1a; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #333; display: flex; justify-content: space-between; }
        #available-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }

        /* CENTER WORKSPACE */
        #center-workspace { flex-grow: 1; display: flex; flex-direction: column; border-right: 2px solid #222; height: 100vh; position: relative; }
        #map-container { flex: 1; position: relative; overflow: hidden; background: #000; cursor: grab; }
        #map-content { position: absolute; transform-origin: 0 0; will-change: transform; top: 0; left: 0; min-width: 3000px; min-height: 3000px; }
        #background-map { display: block; pointer-events: none; }

        #timer-section { height: 240px; background: #111; border-top: 2px solid #333; display: flex; flex-direction: column; z-index: 20; }
        #timer-grid { flex-grow: 1; display: flex; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }

        /* RIGHT SIDEBAR */
        #right-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        #recommendation-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }
        
        .rec-card { background: #1a1a1a; border-left: 4px solid var(--logistics-blue); padding: 12px; margin-bottom: 10px; border-radius: 4px; animation: pulse-border 2s infinite; }
        @keyframes pulse-border { 0%, 100% { border-left-color: #004c5b; } 50% { border-left-color: var(--logistics-blue); } }
        .rec-title { font-size: 9px; color: var(--logistics-blue); font-weight: bold; }
        .rec-instruction { font-size: 13px; font-weight: bold; color: #fff; }

        /* UNIT CARDS */
        .unit-slot { min-height: 55px; border: 1px solid #222; margin-bottom: 8px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .ambulance-icon { padding: 10px; cursor: grab; display: flex; flex-direction: column; align-items: center; background: #262626; border: 1px solid #444; border-radius: 4px; width: 100%; position: relative; }
        .ambulance-icon:active { cursor: grabbing; }
        .unit-label { font-size: 14px; font-weight: 900; }
        .unit-status-text { font-size: 9px; color: #999; margin-top: 3px; text-transform: uppercase; font-weight: bold; }

        /* STATES */
        .state-call .unit-label { color: var(--bright-red); }
        .state-dest .unit-label { color: var(--hosp-orange); }
        .state-logs .unit-label { color: var(--logistics-blue); }
        .state-map { width: 95px !important; border-color: var(--logistics-blue); border-width: 2px; }
        .state-map .unit-label { color: var(--logistics-blue); }
        
        .oos { filter: grayscale(1) brightness(0.4); opacity: 0.5 !important; border: 1px dashed #f00 !important; }
        .hidden-unit { display: none !important; }

        /* CONFIG MODAL */
        #system-gear { position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-size: 22px; cursor: pointer; background: #000; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #333; color: #666; }
        #config-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        #config-panel { background: #1a1a1a; width: 500px; max-height: 85vh; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; padding: 20px; }
        .config-list { flex-grow: 1; overflow-y: auto; margin: 15px 0; border-top: 1px solid #222; }
        .config-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #222; }
        
        .toggle-btn { cursor: pointer; padding: 6px 15px; border-radius: 4px; font-size: 11px; font-weight: bold; border: none; min-width: 100px; }
        .toggle-active { background: var(--neon-green); color: black; }
        .toggle-inactive { background: #333; color: #777; }

        /* CONTEXT MENU */
        #context-menu { position: fixed; display: none; background: #1a1a1a; border: 1px solid #444; z-index: 10000; width: 220px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .menu-item { padding: 12px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #222; }
        .menu-item:hover { background: #333; }
        .menu-header { padding: 10px; font-size: 11px; background: #000; color: #888; font-weight: bold; text-align: center; }

        /* TIMER CARDS */
        .timer-card { min-width: 180px; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #333; border-top: 4px solid #444; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 30px; margin: 5px 0; font-weight: bold; color: white; }
        .type-call { border-top-color: var(--bright-red); }
        .type-dest { border-top-color: var(--hosp-orange); }
        .type-logs { border-top-color: var(--logistics-blue); }
    </style>
</head>
<body>

    <div id="left-sidebar">
        <div id="system-status-box">
            <div class="gauge-label">SYSTEM STATUS</div>
            <div id="gas-gauge">0</div>
            <div class="gauge-label">READY UNITS</div>
            <button class="recall-btn" onclick="recallAllUnits()">Recall All to Base</button>
        </div>
        <div class="list-header">Stationed Units</div>
        <div id="available-list"></div>
    </div>

    <div id="center-workspace">
        <div id="map-container">
            <div id="map-content">
                <img src="map.jpeg" id="background-map">
            </div>
        </div>
        <div id="timer-section">
            <div class="list-header">Active Timers & Dispatch</div>
            <div id="timer-grid"></div>
        </div>
    </div>

    <div id="right-sidebar">
        <div class="list-header">Move-Up Logic</div>
        <div id="recommendation-list"></div>
    </div>

    <div id="system-gear" onclick="toggleConfig(true)">⚙️</div>

    <div id="config-modal">
        <div id="config-panel">
            <h2 style="margin:0;">Fleet Configuration</h2>
            <div class="config-list" id="config-list-content"></div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button onclick="toggleConfig(false)" style="flex:1; padding:12px; background:var(--logistics-blue); border:none; border-radius:4px; font-weight:bold; cursor:pointer;">CLOSE</button>
                <button onclick="if(confirm('Wipe everything?')) { localStorage.clear(); location.reload(); }" style="padding:12px; background:#400; color:white; border:none; border-radius:4px; font-size:11px;">HARD RESET</button>
            </div>
        </div>
    </div>

    <div id="context-menu">
        <div id="menu-id" class="menu-header">UNIT</div>
        <div class="menu-item" onclick="startStatusTimer('CALL')">Assign: ON A CALL</div>
        <div class="menu-item" onclick="startStatusTimer('DEST')" style="color:var(--hosp-orange);">Mark: AT DESTINATION (20m)</div>
        <div class="menu-item" onclick="startStatusTimer('LOGS')" style="color:var(--logistics-blue);">Mark: LOGISTICS (10m)</div>
        <div class="menu-item" onclick="toggleOOS()" style="color:var(--bright-red); border-top:1px solid #333;">Toggle OOS</div>
        <div class="menu-item" onclick="forceReady(selectedUnitId)" style="color:var(--neon-green); font-weight:bold;">CLEAR / RETURN TO BASE</div>
        <div class="menu-header" style="border-top:1px solid #333;">STAGING</div>
        <div id="staging-list"></div>
    </div>

    <script>
        const postData = [
            { id: 1, name: "Belton", home: "Med-2", lat: 34.49, long: -82.52, isPrimary: true },
            { id: 2, name: "Homeland Park", home: "Med-3", lat: 34.46, long: -82.65, isPrimary: true },
            { id: 3, name: "Honea Path", home: "Med-13", lat: 34.45, long: -82.40, isPrimary: true },
            { id: 4, name: "Wren", home: "Med-15", lat: 34.71, long: -82.50, isPrimary: true },
            { id: 5, name: "Iva", home: "Med-6", lat: 34.30, long: -82.66, isPrimary: true },
            { id: 6, name: "Williamston", home: "Med-4", lat: 34.61, long: -82.49, isPrimary: true },
            { id: 7, name: "Pendleton", home: "Med-7", lat: 34.64, long: -82.78, isPrimary: true },
            { id: 8, name: "Powdersville", home: "Med-14", lat: 34.77, long: -82.48, isPrimary: true },
            { id: 9, name: "Townville", home: "Med-8", lat: 34.56, long: -82.88, isPrimary: true },
            { id: 10, name: "Centerville", home: "Med-9", lat: 34.54, long: -82.69, isPrimary: true },
            { id: 12, name: "Hopewell", home: "Med-5", lat: 34.59, long: -82.62, isPrimary: true },
            { id: 11, name: "HQ", home: "City", lat: 34.51, long: -82.64, isPrimary: false }
        ];

        const units = [
            { id: "Med-0", home: "City Truck", pId: 11 }, { id: "Med-1", home: "City Truck", pId: 11 },
            { id: "Med-2", home: "Belton", pId: 1 }, { id: "Med-3", home: "Homeland", pId: 2 },
            { id: "Med-4", home: "Williamston", pId: 6 }, { id: "Med-5", home: "Hopewell", pId: 12 },
            { id: "Med-6", home: "Iva", pId: 5 }, { id: "Med-7", home: "Pendleton", pId: 7 },
            { id: "Med-8", home: "Townville", pId: 9 }, { id: "Med-9", home: "Centerville", pId: 10 },
            { id: "Med-10", home: "City Truck", pId: 11 }, { id: "Med-11", home: "City Truck", pId: 11 },
            { id: "Med-12", home: "City Truck", pId: 11 }, { id: "Med-13", home: "Honea Path", pId: 3 },
            { id: "Med-14", home: "Powdersville", pId: 8 }, { id: "Med-15", home: "Wren", pId: 4 },
            { id: "Med-16", home: "City Truck", pId: 11 }, { id: "Med-17", home: "City Truck", pId: 11 },
            { id: "Med-18", home: "City Truck", pId: 11 }, { id: "Med-19", home: "City Truck", pId: 11 }
        ];

        const mapContainer = document.getElementById('map-container');
        const mapContent = document.getElementById('map-content');
        const availableList = document.getElementById('available-list');
        const recList = document.getElementById('recommendation-list');
        const timerGrid = document.getElementById('timer-grid');
        const gauge = document.getElementById('gas-gauge');
        const ctxMenu = document.getElementById('context-menu');
        
        let selectedUnitId = null;
        let scale = 1, posX = 0, posY = 0;
        let unitStates = {}; 

        function updateTransform() { mapContent.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

        function updateStatus() {
            let readyCount = 0;
            let criticalGaps = [];
            let flexibleUnits = [];

            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (!el) return;

                const isDeactivated = localStorage.getItem(`inactive-${u.id}`) === 'true';
                if (isDeactivated) {
                    el.classList.add('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.add('hidden-unit');
                    return;
                } else {
                    el.classList.remove('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.remove('hidden-unit');
                }

                el.classList.remove('state-call', 'state-dest', 'state-logs', 'state-map');
                const stateObj = unitStates[u.id];
                const isOOS = el.classList.contains('oos');
                const isOnMap = el.parentElement.id === 'map-content';
                const isStationed = el.parentElement.closest('#available-list');
                const statusLabel = el.querySelector('.unit-status-text');

                if (stateObj) {
                    el.classList.add('state-' + stateObj.type.toLowerCase());
                    statusLabel.innerText = stateObj.type === 'CALL' ? "ON CALL" : (stateObj.type === 'DEST' ? "AT DEST" : "LOGISTICS");
                    if (u.pId !== 11) criticalGaps.push(postData.find(p => p.id === u.pId));
                } else if (isOOS) {
                    statusLabel.innerText = "OOS";
                    if (u.pId !== 11) criticalGaps.push(postData.find(p => p.id === u.pId));
                } else {
                    readyCount++;
                    if (isOnMap) {
                        el.classList.add('state-map');
                        const stagedAt = localStorage.getItem(`staged-${u.id}`);
                        statusLabel.innerText = stagedAt ? `POSTED: ${stagedAt}` : "POSTED";
                    } else {
                        statusLabel.innerText = u.home;
                    }
                    if (u.pId === 11 && isStationed) flexibleUnits.push(u.id);
                }
            });

            gauge.innerText = readyCount;
            gauge.style.color = readyCount <= 3 ? "var(--bright-red)" : "var(--neon-green)";

            recList.innerHTML = '';
            criticalGaps.forEach(gap => {
                const helper = flexibleUnits.shift();
                if (helper) {
                    const card = document.createElement('div');
                    card.className = 'rec-card';
                    card.innerHTML = `<div class="rec-title">GAP: ${gap.name}</div><div class="rec-instruction">Move <b>${helper}</b> to cover</div>`;
                    recList.appendChild(card);
                }
            });
        }

        function forceReady(uId) {
            delete unitStates[uId];
            const el = document.getElementById(uId);
            if (!el) return;
            el.classList.remove('oos');
            localStorage.removeItem(`oos-${uId}`);
            const slot = document.getElementById(`slot-${uId}`);
            slot.appendChild(el);
            el.style.position = "relative"; el.style.left = "0"; el.style.top = "0"; el.style.width = "100%";
            localStorage.removeItem(`pos-${uId}`);
            localStorage.removeItem(`staged-${uId}`);
            renderTimerCards();
            updateStatus();
        }

        function startStatusTimer(type) {
            unitStates[selectedUnitId] = { type: type, start: Date.now() };
            renderTimerCards();
            ctxMenu.style.display = 'none';
            updateStatus();
        }

        function renderTimerCards() {
            timerGrid.innerHTML = '';
            Object.keys(unitStates).forEach(uId => {
                const s = unitStates[uId];
                const card = document.createElement('div');
                card.className = `timer-card type-${s.type.toLowerCase()}`;
                card.innerHTML = `
                    <div style="font-weight:bold; font-size:16px;">${uId}</div>
                    <div class="timer-display" id="display-${uId}">0:00</div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        ${s.type === 'CALL' ? `<button onclick="transitionToDest('${uId}')" style="flex:1; background:var(--hosp-orange); border:none; color:black; font-weight:bold; padding:5px; cursor:pointer; font-size:10px;">ARRIVED</button>` : ''}
                        <button onclick="forceReady('${uId}')" style="flex:1; background:#333; color:white; border:none; padding:5px; cursor:pointer; font-size:10px;">CLEAR</button>
                    </div>
                `;
                timerGrid.appendChild(card);
            });
        }

        function transitionToDest(uId) {
            unitStates[uId] = { type: 'DEST', start: Date.now() };
            renderTimerCards();
            updateStatus();
        }

        setInterval(() => {
            Object.keys(unitStates).forEach(uId => {
                const s = unitStates[uId];
                const display = document.getElementById(`display-${uId}`);
                if (!display) return;
                const elapsedSec = Math.floor((Date.now() - s.start) / 1000);
                if (s.type === 'CALL') {
                    const m = Math.floor(elapsedSec / 60);
                    const sec = elapsedSec % 60;
                    display.innerText = `${m}:${sec < 10 ? '0' + sec : sec}`;
                } else {
                    const limit = s.type === 'DEST' ? 1200 : 600;
                    const remaining = limit - elapsedSec;
                    const absRem = Math.abs(remaining);
                    const m = Math.floor(absRem / 60);
                    const sec = absRem % 60;
                    display.innerText = (remaining < 0 ? "-" : "") + `${m}:${sec < 10 ? '0' + sec : sec}`;
                    if (remaining < 0) display.style.color = 'var(--bright-red)';
                }
            });
        }, 1000);

        function recallAllUnits() {
            units.forEach(u => {
                if (document.getElementById(u.id).parentElement.id === 'map-content') forceReady(u.id);
            });
        }

        // FIXED DRAGGABLE LOGIC
        function makeDraggable(el) {
            let ox = 0, oy = 0;
            
            // PREVENT NATIVE BROWSER DRAG
            el.addEventListener('dragstart', (e) => e.preventDefault());

            el.onmousedown = (e) => {
                if(e.button !== 0 || e.shiftKey) return;
                e.preventDefault(); e.stopPropagation();
                
                const r = el.getBoundingClientRect();
                ox = (e.clientX - r.left) / scale; oy = (e.clientY - r.top) / scale;
                
                el.style.position = 'fixed';
                el.style.width = '180px';
                el.style.zIndex = '1000';
                document.body.appendChild(el);

                const moveHandler = (ev) => {
                    el.style.left = (ev.clientX - (ox * scale)) + "px";
                    el.style.top = (ev.clientY - (oy * scale)) + "px";
                };

                const upHandler = (ev) => {
                    document.removeEventListener('mousemove', moveHandler);
                    document.removeEventListener('mouseup', upHandler);
                    
                    const mapR = mapContainer.getBoundingClientRect();
                    if (ev.clientX > mapR.left && ev.clientX < mapR.right && ev.clientY < mapR.bottom) {
                        const c = mapContent.getBoundingClientRect();
                        el.style.position = 'absolute';
                        el.style.left = ((ev.clientX - c.left) / scale - ox) + "px";
                        el.style.top = ((ev.clientY - c.top) / scale - oy) + "px";
                        mapContent.appendChild(el);
                        localStorage.setItem(`pos-${el.id}`, JSON.stringify({left: el.style.left, top: el.style.top}));
                    } else {
                        forceReady(el.id);
                    }
                    updateStatus();
                };

                document.addEventListener('mousemove', moveHandler);
                document.addEventListener('mouseup', upHandler);
            };
        }

        function toggleConfig(show) { 
            if (show) renderConfigList();
            document.getElementById('config-modal').style.display = show ? 'flex' : 'none'; 
        }

        function renderConfigList() {
            const container = document.getElementById('config-list-content');
            container.innerHTML = '';
            units.forEach(u => {
                const isInactive = localStorage.getItem(`inactive-${u.id}`) === 'true';
                const item = document.createElement('div');
                item.className = 'config-item';
                item.innerHTML = `<div><b>${u.id}</b></div><button class="toggle-btn ${isInactive ? 'toggle-inactive' : 'toggle-active'}" onclick="toggleUnitActive('${u.id}')">${isInactive ? 'OFF' : 'ON'}</button>`;
                container.appendChild(item);
            });
        }

        function toggleUnitActive(uId) {
            localStorage.setItem(`inactive-${uId}`, localStorage.getItem(`inactive-${uId}`) !== 'true');
            renderConfigList(); updateStatus();
        }

        function init() {
            renderStagingMenu();
            units.forEach(u => {
                const slot = document.createElement('div');
                slot.className = 'unit-slot'; slot.id = `slot-${u.id}`;
                availableList.appendChild(slot);
                const div = document.createElement('div');
                div.className = 'ambulance-icon'; div.id = u.id;
                div.innerHTML = `<div class="unit-label">${u.id}</div><div class="unit-status-text"></div>`;
                div.oncontextmenu = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    selectedUnitId = u.id;
                    document.getElementById('menu-id').innerText = u.id;
                    ctxMenu.style.display = 'block';
                    ctxMenu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
                    ctxMenu.style.top = Math.min(e.pageY, window.innerHeight - 450) + 'px';
                };
                const savedPos = localStorage.getItem(`pos-${u.id}`);
                if (localStorage.getItem(`oos-${u.id}`) === 'true') div.classList.add('oos');
                if (savedPos) {
                    const p = JSON.parse(savedPos);
                    div.style.position = 'absolute'; div.style.left = p.left; div.style.top = p.top;
                    mapContent.appendChild(div);
                } else {
                    slot.appendChild(div);
                }
                makeDraggable(div);
            });
            updateStatus();
        }

        function toggleOOS() {
            const isOOS = document.getElementById(selectedUnitId).classList.toggle('oos');
            localStorage.setItem(`oos-${selectedUnitId}`, isOOS);
            ctxMenu.style.display = 'none'; updateStatus();
        }

        function renderStagingMenu() {
            const list = document.getElementById('staging-list');
            postData.filter(p => p.isPrimary).forEach(p => {
                const div = document.createElement('div');
                div.className = 'menu-item'; div.innerText = p.name;
                div.onmousedown = () => {
                    localStorage.setItem(`staged-${selectedUnitId}`, p.name);
                    ctxMenu.style.display = 'none'; updateStatus();
                };
                list.appendChild(div);
            });
        }

        mapContainer.onwheel = e => {
            e.preventDefault();
            const rect = mapContainer.getBoundingClientRect();
            const zoom = 1 + (-Math.sign(e.deltaY) * 0.1);
            const newScale = scale * zoom;
            if (newScale > 0.1 && newScale < 5) {
                posX = (e.clientX - rect.left) - ((e.clientX - rect.left) - posX) * zoom;
                posY = (e.clientY - rect.top) - ((e.clientY - rect.top) - posY) * zoom;
                scale = newScale; updateTransform();
            }
        };

        window.onmousedown = (e) => { if (!ctxMenu.contains(e.target) && !document.getElementById('config-modal').contains(e.target)) ctxMenu.style.display = 'none'; }
        window.onload = init;
    </script>
</body>
</html>
