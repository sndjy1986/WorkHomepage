<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Dispatch | Command Console v24</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bright-red: #ff0000;
            --hosp-orange: #ff8c00;
            --post-blue: #00d4ff;
            --bg-dark: #0a0a0a;
            --panel-bg: #161616;
            --sidebar-w: 260px;
        }

        * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; outline: none; box-sizing: border-box; }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* LEFT SIDEBAR */
        #left-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; border-right: 2px solid #222; flex-shrink: 0; }
        #system-status-box { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid #333; }
        #gas-gauge { font-size: 52px; font-weight: 900; line-height: 1; margin: 5px 0; color: var(--neon-green); }
        .gauge-label { font-size: 10px; color: #888; letter-spacing: 1px; font-weight: bold; }
        .recall-btn { margin-top: 10px; padding: 6px; font-size: 9px; background: #222; border: 1px solid #444; color: #aaa; cursor: pointer; border-radius: 3px; width: 100%; font-weight: bold; }
        .recall-btn:hover { background: #333; color: white; border-color: var(--post-blue); }

        .list-header { font-size: 11px; padding: 10px; background: #1a1a1a; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #available-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }

        /* CENTER WORKSPACE */
        #center-workspace { flex-grow: 1; display: flex; flex-direction: column; border-right: 2px solid #222; height: 100vh; position: relative; }
        #map-container { flex: 1; position: relative; overflow: hidden; background: #000; cursor: grab; }
        #map-container:active { cursor: grabbing; }
        #map-content { position: absolute; transform-origin: 0 0; will-change: transform; top: 0; left: 0; min-width: 3000px; min-height: 3000px; }
        #background-map { display: block; pointer-events: none; }

        #timer-section { height: 260px; background: #111; border-top: 2px solid #333; display: flex; flex-direction: column; z-index: 20; }
        #timer-grid { flex-grow: 1; display: flex; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }

        /* RIGHT SIDEBAR */
        #right-sidebar { width: var(--sidebar-w); background: var(--panel-bg); display: flex; flex-direction: column; flex-shrink: 0; }
        #recommendation-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }
        
        .rec-card { 
            background: #1a1a1a; border-left: 4px solid var(--post-blue); 
            padding: 12px; margin-bottom: 10px; border-radius: 4px;
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border { 0% { border-left-color: #004c5b; } 50% { border-left-color: var(--post-blue); } 100% { border-left-color: #004c5b; } }
        .rec-title { font-size: 9px; color: var(--post-blue); font-weight: bold; margin-bottom: 4px; text-transform: uppercase; }
        .rec-instruction { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.3; }
        .rec-dist { font-size: 10px; color: #666; margin-top: 4px; }

        /* UNIT CARDS */
        .unit-slot { min-height: 55px; border: 1px solid #222; margin-bottom: 8px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .ambulance-icon { 
            padding: 10px; cursor: grab; display: flex; flex-direction: column; align-items: center; 
            background: #262626; border: 1px solid #444; border-radius: 4px; width: 100%;
        }
        .unit-label { font-size: 14px; font-weight: 900; }
        .unit-status-text { font-size: 9px; color: #999; margin-top: 3px; text-align: center; text-transform: uppercase; font-weight: bold; }

        /* STATES */
        .state-map { width: 90px !important; border-color: var(--post-blue); border-width: 2px; box-shadow: 0 0 15px rgba(0, 212, 255, 0.2); }
        .state-map .unit-label { color: var(--post-blue); }
        .state-dest .unit-label { color: var(--hosp-orange); }
        .oos { filter: grayscale(1) brightness(0.4); opacity: 0.5 !important; }
        .hidden-unit { display: none !important; }

        /* GEAR & CONFIG */
        #system-gear { position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-size: 22px; cursor: pointer; background: #000; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #333; }
        #config-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; }
        #config-panel { background: #1a1a1a; width: 500px; max-height: 80vh; border-radius: 8px; border: 1px solid #444; display: flex; flex-direction: column; padding: 20px; }
        .config-list { flex-grow: 1; overflow-y: auto; margin: 15px 0; }
        .config-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #222; }
        .toggle-btn { cursor: pointer; padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: bold; background: #333; color: #888; border: none; }
        .toggle-on { background: var(--neon-green); color: #000; }

        /* CONTEXT MENU */
        #context-menu { position: fixed; display: none; background: #1a1a1a; border: 1px solid #444; z-index: 10000; width: 220px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .menu-item { padding: 12px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #222; }
        .menu-item:hover { background: #333; }
        .menu-header { padding: 10px; font-size: 11px; background: #000; color: #888; font-weight: bold; text-align: center; }
        .submenu-container { max-height: 200px; overflow-y: auto; background: #111; }

        .timer-card { min-width: 170px; background: #1a1a1a; border-top: 4px solid var(--hosp-orange); padding: 12px; border-radius: 4px; border: 1px solid #333; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 30px; margin: 5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="left-sidebar">
        <div id="system-status-box">
            <div class="gauge-label">SYSTEM STATUS</div>
            <div id="gas-gauge">0</div>
            <div class="gauge-label">READY UNITS</div>
            <button class="recall-btn" onclick="recallAllUnits()">RECALL ALL POSTED</button>
        </div>
        <div class="list-header">Stationed Units</div>
        <div id="available-list"></div>
    </div>

    <div id="center-workspace">
        <div id="map-container">
            <div id="map-content">
                <img src="map.jpeg" id="background-map">
            </div>
        </div>
        <div id="timer-section">
            <div class="list-header">
                <span>Hospital / Call Timers</span>
                <button onclick="resetView()" style="font-size:9px; cursor:pointer; background:#333; color:white; border:none; padding:3px 8px; border-radius:3px;">RESET MAP</button>
            </div>
            <div id="timer-grid"></div>
        </div>
    </div>

    <div id="right-sidebar">
        <div class="list-header">Move-Up Logic (Geo-Stringent)</div>
        <div id="recommendation-list"></div>
    </div>

    <div id="system-gear" onclick="toggleConfig(true)">⚙️</div>

    <div id="config-modal">
        <div id="config-panel">
            <h2 style="margin-top:0;">Fleet Configuration</h2>
            <div class="config-list" id="config-list-content"></div>
            <button onclick="toggleConfig(false)" style="padding:10px; background:var(--post-blue); border:none; border-radius:4px; font-weight:bold; cursor:pointer;">SAVE & CLOSE</button>
        </div>
    </div>

    <div id="context-menu">
        <div id="menu-id" class="menu-header">UNIT</div>
        <div class="menu-item" onclick="startTimer(20, 'GMH')">Assign: GMH (20m)</div>
        <div class="menu-item" onclick="startTimer(20, 'AMH')">Assign: AMH (20m)</div>
        <div class="menu-item" onclick="toggleOOS()" style="color:var(--bright-red); font-weight:bold;">OUT OF SERVICE (OOS)</div>
        <div class="menu-item" onclick="returnToBase(selectedUnitId)" style="color:var(--post-blue); border-top:1px solid #333;">RETURN TO BASE (AVAILABLE)</div>
        <div id="staging-option" style="display:none;">
            <div class="menu-header" style="border-top:1px solid #333;">STAGE AT POST</div>
            <div class="submenu-container" id="staging-list"></div>
        </div>
    </div>

    <script>
        const postData = [
            { id: 1, name: "Rock Springs", home: "Med-2", lat: 34.4970557, long: -82.5237544, isPrimary: true },
            { id: 2, name: "Homeland Park", home: "Med-3", lat: 34.46718628, long: -82.65578639, isPrimary: true },
            { id: 3, name: "Honea Path", home: "Med-13", lat: 34.45442718, long: -82.40514863, isPrimary: true },
            { id: 4, name: "Wren FD", home: "Med-15", lat: 34.7114341, long: -82.5089313, isPrimary: true },
            { id: 5, name: "Iva City", home: "Med-6", lat: 34.3024749, long: -82.6655562, isPrimary: true },
            { id: 6, name: "Williamston", home: "Med-4", lat: 34.6163175, long: -82.49073195, isPrimary: true },
            { id: 7, name: "Pendleton", home: "Med-7", lat: 34.64900461, long: -82.78013693, isPrimary: true },
            { id: 8, name: "Powdersville", home: "Med-14", lat: 34.7747891, long: -82.4877423, isPrimary: true },
            { id: 9, name: "Townville", home: "Med-8", lat: 34.5651501, long: -82.8895488, isPrimary: true },
            { id: 10, name: "Centerville", home: "Med-9", lat: 34.5457262, long: -82.695841, isPrimary: true },
            { id: 11, name: "HQ A", home: "Med-0", lat: 34.5136613, long: -82.6486386, isPrimary: false },
            { id: 112, name: "HQ B", home: "Med-1", lat: 34.5136613, long: -82.6486386, isPrimary: false },
            { id: 12, name: "Hopewell", home: "Med-5", lat: 34.596524, long: -82.6278652, isPrimary: true },
            { id: 16, name: "HQ (City)", home: "Med-12", lat: 34.5136613, long: -82.6486386, isPrimary: false }
        ];

        const units = [
            { id: "Med-0", home: "City Truck", pId: 11 }, { id: "Med-1", home: "City Truck", pId: 11 },
            { id: "Med-2", home: "Belton", pId: 1 }, { id: "Med-3", home: "Homeland Park", pId: 2 },
            { id: "Med-4", home: "Williamston", pId: 6 }, { id: "Med-5", home: "Hopewell", pId: 12 },
            { id: "Med-6", home: "Iva", pId: 5 }, { id: "Med-7", home: "Pendleton", pId: 7 },
            { id: "Med-8", home: "Townville", pId: 9 }, { id: "Med-9", home: "Centerville", pId: 10 },
            { id: "Med-10", home: "City / Night", pId: 11 }, { id: "Med-11", home: "City / Night", pId: 11 },
            { id: "Med-12", home: "City Truck", pId: 16 }, { id: "Med-13", home: "Honea Path", pId: 3 },
            { id: "Med-14", home: "Powdersville", pId: 8 }, { id: "Med-15", home: "Wren", pId: 4 },
            { id: "Med-16", home: "City Truck", pId: 16 }, { id: "Med-17", home: "City Truck", pId: 16 },
            { id: "Med-18", home: "City Truck", pId: 16 }, { id: "Med-19", home: "City Truck", pId: 16 }
        ];

        const mapContainer = document.getElementById('map-container');
        const mapContent = document.getElementById('map-content');
        const availableList = document.getElementById('available-list');
        const recList = document.getElementById('recommendation-list');
        const timerGrid = document.getElementById('timer-grid');
        const gauge = document.getElementById('gas-gauge');
        const ctxMenu = document.getElementById('context-menu');
        
        let selectedUnitId = null;
        let scale = 1, posX = 0, posY = 0;

        function getDist(lat1, lon1, lat2, lon2) {
            const R = 3958.8;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function updateTransform() { mapContent.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }
        function resetView() { scale = 1; posX = 0; posY = 0; updateTransform(); }

        mapContainer.onwheel = e => {
            e.preventDefault();
            const rect = mapContainer.getBoundingClientRect();
            const zoom = 1 + (-Math.sign(e.deltaY) * 0.1);
            const newScale = scale * zoom;
            if (newScale > 0.1 && newScale < 5) {
                posX = (e.clientX - rect.left) - ((e.clientX - rect.left) - posX) * zoom;
                posY = (e.clientY - rect.top) - ((e.clientY - rect.top) - posY) * zoom;
                scale = newScale; updateTransform();
            }
        };

        mapContainer.onmousedown = e => {
            if (e.shiftKey || e.button === 1) {
                let sX = e.clientX - posX, sY = e.clientY - posY;
                document.onmousemove = ev => { posX = ev.clientX - sX; posY = ev.clientY - sY; updateTransform(); };
                document.onmouseup = () => document.onmousemove = null;
            }
        };

        function updateStatus() {
            let readyCount = 0;
            let criticalGaps = [];
            let flexibleUnits = [];

            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (!el) return;

                const isDeactivated = localStorage.getItem(`inactive-${u.id}`) === 'true';
                if (isDeactivated) {
                    el.classList.add('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.add('hidden-unit');
                    return;
                } else {
                    el.classList.remove('hidden-unit');
                    document.getElementById(`slot-${u.id}`).classList.remove('hidden-unit');
                }

                el.classList.remove('state-map', 'state-dest');
                const hasTimer = document.querySelectorAll(`.timer-card[data-unit="${u.id}"]`).length > 0;
                const isOOS = el.classList.contains('oos');
                const isOnMap = el.parentElement.id === 'map-content';
                const isStationed = el.parentElement.closest('#available-list');

                const unitPostObj = postData.find(p => p.id === u.pId);
                const statusLabel = el.querySelector('.unit-status-text');

                if (hasTimer || isOOS) {
                    el.classList.add('state-dest');
                    statusLabel.innerText = isOOS ? "OOS" : "ON CALL";
                    if (unitPostObj && unitPostObj.isPrimary) criticalGaps.push(unitPostObj);
                } else {
                    readyCount++;
                    if (isOnMap) {
                        el.classList.add('state-map');
                        const stagedAt = localStorage.getItem(`staged-${u.id}`);
                        statusLabel.innerText = stagedAt ? `POSTED: ${stagedAt}` : "POSTED";
                    } else {
                        statusLabel.innerText = u.home;
                    }
                    if (unitPostObj && !unitPostObj.isPrimary && isStationed) flexibleUnits.push(u);
                }
            });

            gauge.innerText = readyCount;
            gauge.style.color = readyCount <= 3 ? "var(--bright-red)" : "var(--neon-green)";

            recList.innerHTML = '';
            criticalGaps.forEach(gap => {
                const candidates = flexibleUnits.map(fu => {
                    const hq = postData.find(p => p.id === fu.pId);
                    return { id: fu.id, dist: getDist(hq.lat, hq.long, gap.lat, gap.long) };
                }).sort((a, b) => a.dist - b.dist);

                const closest = candidates[0];
                if (closest) {
                    flexibleUnits = flexibleUnits.filter(f => f.id !== closest.id);
                    const card = document.createElement('div');
                    card.className = 'rec-card';
                    card.innerHTML = `<div class="rec-title">GAP: ${gap.name}</div><div class="rec-instruction">Move <b>${closest.id}</b> to cover</div><div class="rec-dist">Closest travel: ${closest.dist.toFixed(1)} mi</div>`;
                    recList.appendChild(card);
                }
            });

            if (recList.innerHTML === '') recList.innerHTML = '<div style="color:#444; font-size:11px; text-align:center; margin-top:30px;">SYSTEM BALANCED</div>';
        }

        function returnToBase(uId) {
            const el = document.getElementById(uId);
            const slot = document.getElementById(`slot-${uId}`);
            slot.appendChild(el);
            el.style.position = "relative"; el.style.left = "0"; el.style.top = "0"; el.style.width = "100%";
            localStorage.removeItem(`pos-${uId}`);
            localStorage.removeItem(`staged-${uId}`);
            ctxMenu.style.display = 'none';
            updateStatus();
        }

        function recallAllUnits() {
            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (el.parentElement.id === 'map-content') returnToBase(u.id);
            });
        }

        function init() {
            renderConfigMenu();
            renderStagingMenu();
            units.forEach(u => {
                const slot = document.createElement('div');
                slot.className = 'unit-slot'; slot.id = `slot-${u.id}`;
                availableList.appendChild(slot);

                const div = document.createElement('div');
                div.className = 'ambulance-icon'; div.id = u.id;
                div.innerHTML = `<div class="unit-label">${u.id}</div><div class="unit-status-text"></div>`;
                
                div.oncontextmenu = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    selectedUnitId = u.id;
                    document.getElementById('menu-id').innerText = u.id;
                    const isOnMap = div.parentElement.id === 'map-content';
                    document.getElementById('staging-option').style.display = isOnMap ? 'block' : 'none';
                    ctxMenu.style.display = 'block';
                    ctxMenu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
                    ctxMenu.style.top = Math.min(e.pageY, window.innerHeight - 400) + 'px';
                };

                if (localStorage.getItem(`oos-${u.id}`) === 'true') div.classList.add('oos');
                const savedPos = localStorage.getItem(`pos-${u.id}`);
                if (savedPos) {
                    const p = JSON.parse(savedPos);
                    div.style.position = 'absolute'; div.style.left = p.left; div.style.top = p.top;
                    mapContent.appendChild(div);
                } else {
                    slot.appendChild(div);
                }
                makeDraggable(div);
            });
            updateStatus();
        }

        function makeDraggable(el) {
            let ox = 0, oy = 0;
            el.onmousedown = (e) => {
                if(e.button !== 0 || e.shiftKey) return;
                e.preventDefault(); e.stopPropagation();
                const r = el.getBoundingClientRect();
                ox = (e.clientX - r.left) / scale; oy = (e.clientY - r.top) / scale;
                el.style.position = 'fixed'; el.style.width = '180px'; el.style.zIndex = '1000';
                document.body.appendChild(el);
                document.onmousemove = (ev) => {
                    el.style.left = (ev.clientX - (ox * scale)) + "px";
                    el.style.top = (ev.clientY - (oy * scale)) + "px";
                };
                document.onmouseup = (ev) => {
                    document.onmousemove = null;
                    const mapR = mapContainer.getBoundingClientRect();
                    if (ev.clientX > mapR.left && ev.clientX < mapR.right && ev.clientY < mapR.bottom) {
                        const c = mapContent.getBoundingClientRect();
                        el.style.position = 'absolute'; el.style.left = ((ev.clientX - c.left) / scale - ox) + "px";
                        el.style.top = ((ev.clientY - c.top) / scale - oy) + "px";
                        mapContent.appendChild(el);
                        localStorage.setItem(`pos-${el.id}`, JSON.stringify({left: el.style.left, top: el.style.top}));
                    } else {
                        returnToBase(el.id);
                    }
                    updateStatus();
                };
            };
        }

        function startTimer(min, hosp) {
            const timerId = Date.now();
            const card = document.createElement('div');
            card.className = 'timer-card'; card.id = `card-${timerId}`; card.dataset.unit = selectedUnitId;
            card.innerHTML = `<div style="font-weight:bold; font-size:18px; color:var(--hosp-orange);">${selectedUnitId}</div><div style="font-size:10px; color:#aaa;">DEST: ${hosp}</div><div class="timer-display" id="time-${timerId}">--:--</div><button onclick="dismissTimer('${timerId}')" style="width:100%; font-size:10px; background:#333; color:white; border:1px solid #444; padding:6px; cursor:pointer;">CLEAR CALL</button>`;
            timerGrid.appendChild(card);
            ctxMenu.style.display = 'none';
            updateStatus();
            let sec = min * 60;
            const run = setInterval(() => {
                const el = document.getElementById(`time-${timerId}`);
                if(!el) { clearInterval(run); return; }
                sec--; const a = Math.abs(sec), m = Math.floor(a/60), s = a%60;
                el.innerText = (sec < 0 ? "-" : "") + m + ":" + (s < 10 ? "0"+s : s);
                if (sec < 0) el.style.color = "var(--bright-red)";
            }, 1000);
        }

        function dismissTimer(tId) { document.getElementById(`card-${tId}`).remove(); updateStatus(); }
        function toggleOOS() {
            const isOOS = document.getElementById(selectedUnitId).classList.toggle('oos');
            localStorage.setItem(`oos-${selectedUnitId}`, isOOS);
            ctxMenu.style.display = 'none'; updateStatus();
        }

        function renderStagingMenu() {
            const list = document.getElementById('staging-list');
            postData.filter(p => p.isPrimary).forEach(p => {
                const div = document.createElement('div');
                div.className = 'menu-item';
                div.innerText = p.name;
                div.onclick = () => {
                    localStorage.setItem(`staged-${selectedUnitId}`, p.name);
                    ctxMenu.style.display = 'none';
                    updateStatus();
                };
                list.appendChild(div);
            });
        }

        function toggleConfig(show) { document.getElementById('config-modal').style.display = show ? 'flex' : 'none'; }
        function renderConfigMenu() {
            const container = document.getElementById('config-list-content');
            container.innerHTML = '';
            units.sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric:true})).forEach(u => {
                const isInactive = localStorage.getItem(`inactive-${u.id}`) === 'true';
                const item = document.createElement('div');
                item.className = 'config-item';
                item.innerHTML = `<div><b>${u.id}</b><br><small>${u.home}</small></div><button class="toggle-btn ${isInactive ? '' : 'toggle-on'}" onclick="toggleUnitActive('${u.id}')">${isInactive ? 'INACTIVE' : 'IN SERVICE'}</button>`;
                container.appendChild(item);
            });
        }
        function toggleUnitActive(uId) {
            const current = localStorage.getItem(`inactive-${uId}`) === 'true';
            localStorage.setItem(`inactive-${uId}`, !current);
            renderConfigMenu(); updateStatus();
        }

        window.onclick = () => ctxMenu.style.display = 'none';
        window.onload = init;
    </script>
</body>
</html>
