<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priority Dispatch | Command Console v30</title>
    <style>
        :root {
            --neon-green: #00ff41;
            --bright-red: #ff0000;
            --hosp-orange: #ff8c00;
            --logistics-blue: #00d4ff;
            --bg-dark: #0a0a0a;
            --panel-bg: #161616;
            --sidebar-w: 260px;
        }

        * { -webkit-user-select: none; user-select: none; -webkit-user-drag: none; outline: none; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; background: var(--bg-dark); color: white; height: 100vh; overflow: hidden; display: flex; }

        /* SIDEBARS */
        #left-sidebar { width: var(--sidebar-w); background: var(--panel-bg); border-right: 2px solid #222; flex-shrink: 0; display: flex; flex-direction: column; }
        #right-sidebar { width: var(--sidebar-w); background: var(--panel-bg); border-left: 2px solid #222; flex-shrink: 0; display: flex; flex-direction: column; }
        
        #system-status-box { padding: 15px; text-align: center; background: #000; border-bottom: 2px solid #333; }
        #gas-gauge { font-size: 52px; font-weight: 900; line-height: 1; margin: 5px 0; color: var(--neon-green); }
        .gauge-label { font-size: 10px; color: #888; letter-spacing: 1px; font-weight: bold; }
        .recall-btn { margin-top: 10px; padding: 8px; font-size: 9px; background: #222; border: 1px solid #444; color: #aaa; cursor: pointer; border-radius: 3px; width: 100%; font-weight: bold; }

        .list-header { font-size: 11px; padding: 10px; background: #1a1a1a; color: #aaa; text-transform: uppercase; border-bottom: 1px solid #333; }
        #available-list, #recommendation-list { flex-grow: 1; overflow-y: auto; padding: 10px; background: #0d0d0d; }

        /* CENTER */
        #center-workspace { flex-grow: 1; display: flex; flex-direction: column; position: relative; height: 100vh; }
        #map-container { flex: 1; position: relative; overflow: hidden; background: #000; cursor: grab; }
        #map-content { position: absolute; transform-origin: 0 0; will-change: transform; top: 0; left: 0; min-width: 3000px; min-height: 3000px; }
        #background-map { display: block; pointer-events: none; }

        #timer-section { height: 240px; background: #111; border-top: 2px solid #333; display: flex; flex-direction: column; z-index: 20; }
        #timer-grid { flex-grow: 1; display: flex; gap: 12px; padding: 12px; overflow-x: auto; align-items: flex-start; }

        /* CARDS */
        .rec-card { background: #1a1a1a; border-left: 4px solid var(--logistics-blue); padding: 12px; margin-bottom: 10px; border-radius: 4px; animation: pulse 2s infinite; border-top: 1px solid #333; }
        @keyframes pulse { 0%, 100% { border-left-color: #004c5b; } 50% { border-left-color: var(--logistics-blue); } }
        .rec-title { font-size: 9px; color: var(--logistics-blue); font-weight: bold; text-transform: uppercase; margin-bottom: 4px; }
        .rec-instruction { font-size: 13px; font-weight: bold; color: #fff; line-height: 1.4; }
        
        .unit-slot { min-height: 55px; border: 1px solid #222; margin-bottom: 8px; border-radius: 4px; background: rgba(0,0,0,0.2); }
        .ambulance-icon { padding: 10px; cursor: grab; display: flex; flex-direction: column; align-items: center; background: #262626; border: 1px solid #444; border-radius: 4px; width: 100%; position: relative; }
        .unit-label { font-size: 14px; font-weight: 900; }
        .unit-status-text { font-size: 9px; color: #999; margin-top: 3px; text-transform: uppercase; font-weight: bold; }

        .state-call .unit-label { color: var(--bright-red); }
        .state-dest .unit-label { color: var(--hosp-orange); }
        .state-map { width: 95px !important; border-color: var(--logistics-blue); border-width: 2px; }
        .oos { filter: grayscale(1) brightness(0.4); opacity: 0.5 !important; border: 1px dashed #f00 !important; }
        .hidden-unit { display: none !important; }

        #context-menu { position: fixed; display: none; background: #1a1a1a; border: 1px solid #444; z-index: 10000; width: 220px; box-shadow: 0 10px 40px rgba(0,0,0,0.9); }
        .menu-item { padding: 12px 15px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #222; }
        .menu-item:hover { background: #333; }
        .menu-header { padding: 10px; font-size: 11px; background: #000; color: #888; font-weight: bold; text-align: center; }

        #system-gear { position: fixed; bottom: 20px; right: 20px; z-index: 1000; font-size: 22px; cursor: pointer; background: #000; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 1px solid #333; }
        #config-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; }
        #config-panel { background: #1a1a1a; width: 500px; padding: 20px; border-radius: 8px; border: 1px solid #444; }

        .timer-card { min-width: 180px; background: #1a1a1a; padding: 12px; border-radius: 4px; border: 1px solid #333; border-top: 4px solid #444; }
        .timer-display { font-family: 'Courier New', monospace; font-size: 30px; margin: 5px 0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="left-sidebar">
        <div id="system-status-box">
            <div class="gauge-label">SYSTEM STATUS</div>
            <div id="gas-gauge">0</div>
            <div class="gauge-label">READY UNITS</div>
            <button class="recall-btn" onclick="recallAllUnits()">Recall All to Base</button>
        </div>
        <div class="list-header">Stationed Units</div>
        <div id="available-list"></div>
    </div>

    <div id="center-workspace">
        <div id="map-container">
            <div id="map-content"><img src="map.jpeg" id="background-map"></div>
        </div>
        <div id="timer-section">
            <div class="list-header">Dispatch Timers</div>
            <div id="timer-grid"></div>
        </div>
    </div>

    <div id="right-sidebar">
        <div class="list-header">Posting Plan Logic</div>
        <div id="recommendation-list"></div>
    </div>

    <div id="system-gear" onclick="toggleConfig(true)">⚙️</div>

    <div id="config-modal">
        <div id="config-panel">
            <h2 style="margin:0;">Fleet Configuration</h2>
            <div id="config-list-content" style="max-height: 400px; overflow-y: auto; margin: 15px 0;"></div>
            <button onclick="toggleConfig(false)" style="width:100%; padding:12px; cursor:pointer; background:#333; color:white; border:none; border-radius:4px; font-weight:bold;">SAVE & CLOSE</button>
        </div>
    </div>

    <div id="context-menu">
        <div id="menu-id" class="menu-header">UNIT</div>
        <div class="menu-item" onclick="startStatusTimer('CALL')">Assign: ON A CALL (Count Up)</div>
        <div class="menu-item" onclick="startStatusTimer('DEST')" style="color:var(--hosp-orange);">Mark: AT DESTINATION (20m)</div>
        <div class="menu-item" onclick="startStatusTimer('LOGS')" style="color:var(--logistics-blue);">Mark: LOGISTICS (10m)</div>
        <div class="menu-item" onclick="toggleOOS()" style="color:var(--bright-red); border-top:1px solid #333;">Toggle OOS</div>
        <div class="menu-item" onclick="forceReady(selectedUnitId)" style="color:var(--neon-green); font-weight:bold;">CLEAR / RETURN TO BASE</div>
        <div class="menu-header" style="border-top:1px solid #333;">STAGING POSTS</div>
        <div id="staging-list" style="max-height: 200px; overflow-y: auto; background: #000;"></div>
    </div>

    <script>
        // DATA INTEGRATED FROM POSTING PLAN CSV/PDF
        const postData = [
            { id: 1, name: "Belton", home: "Med-2", addr: "135 HWY 413", lat: 34.497, lon: -82.523, isPrimary: true },
            { id: 2, name: "Homeland Park", home: "Med-3", addr: "3228 S Main St", lat: 34.467, lon: -82.655, isPrimary: true },
            { id: 3, name: "Honea Path", home: "Med-13", addr: "6 Gaines Rd.", lat: 34.454, lon: -82.405, isPrimary: true },
            { id: 4, name: "Wren FD", home: "Med-15", addr: "2209 SC-86", lat: 34.711, lon: -82.508, isPrimary: true },
            { id: 5, name: "Iva City", home: "Med-6", addr: "9711 SC-81", lat: 34.302, lon: -82.665, isPrimary: true },
            { id: 6, name: "Williamston", home: "Med-4", addr: "902 Anderson Dr.", lat: 34.616, lon: -82.490, isPrimary: true },
            { id: 7, name: "Pendleton", home: "Med-7", addr: "111 N Depot St", lat: 34.649, lon: -82.780, isPrimary: true },
            { id: 8, name: "Powdersville", home: "Med-14", addr: "10600 Anderson Rd", lat: 34.774, lon: -82.487, isPrimary: true },
            { id: 9, name: "Townville", home: "Med-8", addr: "8508 SC-24", lat: 34.565, lon: -82.889, isPrimary: true },
            { id: 10, name: "Centerville", home: "Med-9", addr: "103 Construction Way", lat: 34.545, lon: -82.695, isPrimary: true },
            { id: 12, name: "Hopewell", home: "Med-5", addr: "2850 Concord Rd", lat: 34.596, lon: -82.627, isPrimary: true },
            { id: 11, name: "Medshore HQ", home: "City Fleet", addr: "1009 N Fant St", lat: 34.513, lon: -82.648, isPrimary: false },
            { id: 20, name: "81 & Fred Dean", home: "Staging", addr: "6731 SC-81 (Redi Mart)", lat: 34.400, lon: -82.687, isPrimary: false },
            { id: 21, name: "West Anderson", home: "Staging", addr: "W Whitner St & Hwy 28 Bypa", lat: 34.502, lon: -82.683, isPrimary: false },
            { id: 22, name: "White Plains", home: "Staging", addr: "7001 US-29", lat: 34.667, lon: -82.515, isPrimary: false },
            { id: 23, name: "Westgate", home: "Staging", addr: "4396 SC-24", lat: 34.511, lon: -82.756, isPrimary: false }
        ];

        const units = [
            { id: "Med-0", home: "City", pId: 11 }, { id: "Med-1", home: "City", pId: 11 },
            { id: "Med-2", home: "Belton", pId: 1 }, { id: "Med-3", home: "Homeland", pId: 2 },
            { id: "Med-4", home: "Williamston", pId: 6 }, { id: "Med-5", home: "Hopewell", pId: 12 },
            { id: "Med-6", home: "Iva", pId: 5 }, { id: "Med-7", home: "Pendleton", pId: 7 },
            { id: "Med-8", home: "Townville", pId: 9 }, { id: "Med-9", home: "Centerville", pId: 10 },
            { id: "Med-10", home: "Night", pId: 11 }, { id: "Med-11", home: "Night", pId: 11 },
            { id: "Med-12", home: "City", pId: 11 }, { id: "Med-13", home: "Honea Path", pId: 3 },
            { id: "Med-14", home: "Powdersville", pId: 8 }, { id: "Med-15", home: "Wren", pId: 4 },
            { id: "Med-16", home: "City", pId: 11 }, { id: "Med-17", home: "City", pId: 11 },
            { id: "Med-18", home: "City", pId: 11 }, { id: "Med-19", home: "City", pId: 11 }
        ];

        const mapContainer = document.getElementById('map-container');
        const mapContent = document.getElementById('map-content');
        const availableList = document.getElementById('available-list');
        const recList = document.getElementById('recommendation-list');
        const timerGrid = document.getElementById('timer-grid');
        const gauge = document.getElementById('gas-gauge');
        const ctxMenu = document.getElementById('context-menu');
        
        let selectedUnitId = null, scale = 1, posX = 0, posY = 0, unitStates = {};

        function updateTransform() { mapContent.style.transform = `translate(${posX}px, ${posY}px) scale(${scale})`; }

        function updateStatus() {
            let readyCount = 0, criticalGaps = [], flexibleUnits = [];
            let med3Busy = false, med6Busy = false;

            // FIRST PASS: CHECK THE IVA / HOMELAND DUO
            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (!el || localStorage.getItem(`inactive-${u.id}`) === 'true') return;
                const busy = !!unitStates[u.id] || el.classList.contains('oos');
                if (u.id === 'Med-3' && busy) med3Busy = true;
                if (u.id === 'Med-6' && busy) med6Busy = true;
            });

            // SECOND PASS: CALCULATE FLEET & GAPS
            units.forEach(u => {
                const el = document.getElementById(u.id);
                if (!el || localStorage.getItem(`inactive-${u.id}`) === 'true') return;
                
                el.classList.remove('state-call', 'state-dest', 'state-logs', 'state-map');
                const busy = !!unitStates[u.id] || el.classList.contains('oos');
                const isOnMap = el.parentElement.id === 'map-content';
                const statusLabel = el.querySelector('.unit-status-text');

                if (busy) {
                    el.classList.add(unitStates[u.id] ? 'state-' + unitStates[u.id].type.toLowerCase() : 'oos');
                    statusLabel.innerText = unitStates[u.id] ? unitStates[u.id].type : "OOS";
                    
                    // Logic: Homeland triggers move-up. Iva being out is covered by Homeland.
                    if (u.pId !== 11 && u.id !== 'Med-6') {
                        criticalGaps.push(postData.find(p => p.id === u.pId));
                    }
                } else {
                    readyCount++;
                    if (isOnMap) {
                        el.classList.add('state-map');
                        statusLabel.innerText = "POSTED: " + (localStorage.getItem(`staged-${u.id}`) || "");
                    } else { statusLabel.innerText = u.home; }
                    if (u.pId === 11 && !isOnMap) flexibleUnits.push(u.id);
                }
            });

            gauge.innerText = readyCount;
            gauge.style.color = readyCount <= 3 ? "var(--bright-red)" : "var(--neon-green)";

            recList.innerHTML = '';
            criticalGaps.forEach(gap => {
                let html = "";
                if (gap.id === 2 && !med6Busy) {
                    // Homeland Park is empty but Iva is ready -> Command Move Med-6
                    html = `<div class="rec-card"><div class="rec-title">MUTUAL AID: ${gap.name}</div><div class="rec-instruction">Move <b>Med-6</b> to <b>81 & Fred Dean (Redi Mart)</b></div></div>`;
                } else {
                    const helper = flexibleUnits.shift();
                    if (helper) html = `<div class="rec-card"><div class="rec-title">CRITICAL GAP: ${gap.name}</div><div class="rec-instruction">Move <b>${helper}</b> to cover ${gap.name}</div></div>`;
                }
                recList.innerHTML += html;
            });
            if (!recList.innerHTML) recList.innerHTML = '<div style="color:#444; font-size:11px; text-align:center; margin-top:20px;">System Coverage Balanced.</div>';
        }

        // --- CORE LOGIC ---
        function forceReady(uId) {
            delete unitStates[uId];
            const el = document.getElementById(uId);
            if (!el) return;
            el.classList.remove('oos');
            localStorage.removeItem(`oos-${uId}`);
            localStorage.removeItem(`pos-${uId}`);
            localStorage.removeItem(`staged-${uId}`);
            document.getElementById(`slot-${uId}`).appendChild(el);
            el.style.position = "relative"; el.style.left = "0"; el.style.top = "0";
            renderTimerCards(); updateStatus();
        }

        function startStatusTimer(type) {
            unitStates[selectedUnitId] = { type: type, start: Date.now() };
            renderTimerCards(); ctxMenu.style.display = 'none'; updateStatus();
        }

        function renderTimerCards() {
            timerGrid.innerHTML = '';
            Object.keys(unitStates).forEach(uId => {
                const s = unitStates[uId];
                const card = document.createElement('div');
                card.className = `timer-card type-${s.type.toLowerCase()}`;
                card.innerHTML = `<div style="font-weight:bold;">${uId}</div><div class="timer-display" id="display-${uId}">0:00</div>
                    <div style="display:flex; gap:5px; margin-top:10px;">
                        ${s.type === 'CALL' ? `<button onclick="transitionToDest('${uId}')" style="flex:1; background:var(--hosp-orange); padding:5px; cursor:pointer; font-weight:bold; border:none; border-radius:3px;">ARRIVED</button>` : ''}
                        <button onclick="forceReady('${uId}')" style="flex:1; background:#333; color:white; padding:5px; cursor:pointer; border:none; border-radius:3px;">CLEAR</button>
                    </div>`;
                timerGrid.appendChild(card);
            });
        }

        function transitionToDest(uId) { unitStates[uId] = { type: 'DEST', start: Date.now() }; renderTimerCards(); updateStatus(); }

        setInterval(() => {
            Object.keys(unitStates).forEach(uId => {
                const s = unitStates[uId], el = document.getElementById(`display-${uId}`);
                if (!el) return;
                const sec = Math.floor((Date.now() - s.start) / 1000);
                if (s.type === 'CALL') {
                    el.innerText = `${Math.floor(sec/60)}:${(sec%60).toString().padStart(2,'0')}`;
                } else {
                    const rem = (s.type === 'DEST' ? 1200 : 600) - sec;
                    el.innerText = (rem < 0 ? "-" : "") + `${Math.floor(Math.abs(rem)/60)}:${(Math.abs(rem)%60).toString().padStart(2,'0')}`;
                    if (rem < 0) el.style.color = 'var(--bright-red)';
                }
            });
        }, 1000);

        function makeDraggable(el) {
            let ox = 0, oy = 0;
            el.addEventListener('dragstart', (e) => e.preventDefault());
            el.onmousedown = (e) => {
                if(e.button !== 0) return;
                const r = el.getBoundingClientRect();
                ox = (e.clientX - r.left) / scale; oy = (e.clientY - r.top) / scale;
                el.style.position = 'fixed'; el.style.width = '180px'; el.style.zIndex = '1000';
                document.body.appendChild(el);
                const move = (ev) => { el.style.left = (ev.clientX - (ox * scale)) + "px"; el.style.top = (ev.clientY - (oy * scale)) + "px"; };
                const up = (ev) => {
                    document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up);
                    const mR = mapContainer.getBoundingClientRect();
                    if (ev.clientX > mR.left && ev.clientX < mR.right && ev.clientY < mR.bottom) {
                        const c = mapContent.getBoundingClientRect();
                        el.style.position = 'absolute'; el.style.left = ((ev.clientX - c.left) / scale - ox) + "px";
                        el.style.top = ((ev.clientY - c.top) / scale - oy) + "px";
                        mapContent.appendChild(el);
                        localStorage.setItem(`pos-${el.id}`, JSON.stringify({left: el.style.left, top: el.style.top}));
                    } else { forceReady(el.id); }
                    updateStatus();
                };
                document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
            };
        }

        function init() {
            renderStagingMenu();
            units.forEach(u => {
                const slot = document.createElement('div');
                slot.className = 'unit-slot'; slot.id = `slot-${u.id}`;
                availableList.appendChild(slot);
                const div = document.createElement('div');
                div.className = 'ambulance-icon'; div.id = u.id;
                div.innerHTML = `<div class="unit-label">${u.id}</div><div class="unit-status-text"></div>`;
                div.oncontextmenu = (e) => {
                    e.preventDefault(); e.stopPropagation();
                    selectedUnitId = u.id; document.getElementById('menu-id').innerText = u.id;
                    ctxMenu.style.display = 'block'; ctxMenu.style.left = Math.min(e.pageX, window.innerWidth - 220) + 'px';
                    ctxMenu.style.top = Math.min(e.pageY, window.innerHeight - 450) + 'px';
                };
                if (localStorage.getItem(`oos-${u.id}`) === 'true') div.classList.add('oos');
                const saved = localStorage.getItem(`pos-${u.id}`);
                if (saved) {
                    const p = JSON.parse(saved); div.style.position = 'absolute'; div.style.left = p.left; div.style.top = p.top;
                    mapContent.appendChild(div);
                } else { slot.appendChild(div); }
                makeDraggable(div);
            });
            updateStatus();
        }

        function toggleOOS() {
            const isOOS = document.getElementById(selectedUnitId).classList.toggle('oos');
            localStorage.setItem(`oos-${selectedUnitId}`, isOOS);
            ctxMenu.style.display = 'none'; updateStatus();
        }

        function renderStagingMenu() {
            const list = document.getElementById('staging-list');
            list.innerHTML = '';
            postData.filter(p => p.id !== 11).forEach(p => {
                const d = document.createElement('div'); d.className = 'menu-item'; d.innerText = p.name;
                d.onmousedown = () => { localStorage.setItem(`staged-${selectedUnitId}`, p.name); ctxMenu.style.display = 'none'; updateStatus(); };
                list.appendChild(d);
            });
        }

        function toggleConfig(s) { 
            if(s) {
                const c = document.getElementById('config-list-content'); c.innerHTML = '';
                units.sort((a,b) => a.id.localeCompare(b.id, undefined, {numeric: true})).forEach(u => {
                    const act = localStorage.getItem(`inactive-${u.id}`) !== 'true';
                    c.innerHTML += `<div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #222; align-items:center;">
                        <b>${u.id}</b> <button onclick="localStorage.setItem('inactive-${u.id}', ${act}); toggleConfig(true); updateStatus();" 
                        style="background:${act?'var(--neon-green)':'#333'}; padding:8px; border:none; cursor:pointer; min-width:80px; font-weight:bold;">${act?'ACTIVE':'OFF'}</button></div>`;
                });
            }
            document.getElementById('config-modal').style.display = s ? 'flex' : 'none'; 
        }

        function recallAllUnits() { units.forEach(u => { if (document.getElementById(u.id).parentElement.id === 'map-content') forceReady(u.id); }); }

        mapContainer.onwheel = e => {
            e.preventDefault(); const zoom = 1 + (-Math.sign(e.deltaY) * 0.1);
            scale = Math.min(Math.max(scale * zoom, 0.1), 5); updateTransform();
        };

        window.onmousedown = (e) => { if (!ctxMenu.contains(e.target)) ctxMenu.style.display = 'none'; };
        window.onload = init;
    </script>
</body>
</html>
